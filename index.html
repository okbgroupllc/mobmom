header{background:var(--navy);color:#fff;padding:22px 20px}
header h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#c7d4e6;font-size:13px}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;margin-bottom:18px}
h2{margin:0;padding:13px 14px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);border-bottom:1px solid #eef1f5}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:center;border-bottom:1px solid #eef1f5;font-size:14px}
th{background:var(--lblue);color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.empty{padding:22px;color:var(--mut);text-align:center;font-size:13px}
.note{color:var(--mut);font-size:12px;padding:12px 14px;text-align:center}
.pill{background:var(--navy);color:#fff;border-radius:20px;padding:2px 9px;font-size:12px}
.b{font-weight:700}
/* Game cards: one per game, all three markets, both sides, AN-style. */
.gm{border-bottom:1px solid #eef1f5;padding:10px 14px 12px}
.gm:last-child{border-bottom:0}
.gm.fin{background:#fafbfc}.gm.fin .gmt{opacity:.62}
.gmh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;
     color:var(--mut);margin-bottom:4px}
.gmh .k{font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.03em}
.gmt{table-layout:fixed}
.gmt th,.gmt td{border-bottom:0;padding:4px 6px;font-size:13px}
.gmt th{background:none;color:var(--mut);font-size:10px;padding-bottom:2px}
.gmt th:first-child,.gmt td.tm{text-align:left;width:22%}
.gmt td.tm{font-weight:700;font-size:15px}
.ln{font-variant-numeric:tabular-nums}.od{color:var(--mut);font-size:12px}
/* The split is the whole point of the page, so it sits under every price, not just
   the MOBMOM one -- a 45/65 means nothing without the 55/35 opposite it. */
.sp{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.mobc{background:#eaf4ff;border-radius:6px;box-shadow:inset 0 0 0 1px #b7d4f0}
.mobc .sp{color:var(--blue);font-weight:700}
/* The money-lean side of every market. Deliberately FAINTER than .mobc: a lean that
   never crosses 50% measured as a non-edge, so it must not read as a pick. */
.lnc{background:#f6f8fb;border-radius:6px}
.gap{color:var(--blue);font-weight:700}
.op{font-size:10px;color:#9aa5b1;margin-top:1px}
.na{color:#c3cad3}
.mobf{margin-top:8px;font-size:12px;border-top:1px dashed #dde3ea;padding-top:7px}
.mobf.lean .lbl{background:#8d9aa9}
.mobf .lbl{background:var(--navy);color:#fff;border-radius:4px;padding:1px 6px;
           font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.mobf .num{font-weight:700;font-variant-numeric:tabular-nums}
.mobf .sub{color:var(--mut)}

function tbl(cols, rows, render, empty){
  if(!rows.length) return '<div class="empty">'
    + (empty || 'Nothing on the board.') + '</div>';
  let h='<table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  return h+rows.map(render).join('')+'</tbody></table>';
}
function sec(title, inner){
  return '<div class="card"><h2>'+title+'</h2>'+inner+'</div>';
}
// One card per game of the CURRENT NFL WEEK, in kickoff order, finished games last.
// This REPLACED the bet-grain MOBMOM board: it carries the same wager, split, record,
// win% and n, but keeps them attached to the game they came from. Every price prints
// its bet%/money% split, so the MOBMOM side is read against the side opposite it --
// a 45/65 means nothing without the 55/35 facing it, which a list of bets can't show.
// Record / win% / n hang off the MOBMOM cell ONLY: that record belongs to the BET
// TYPE, and putting it on a non-MOBMOM side would imply a tendency nothing measured.
// Three things here are the ENGINE's, not AN's: the money-lean side is marked on
// every market (a MOBMOM is just the lean that also crosses 50%), the lean's gap in
// points is printed, and the OPENING number is shown when the line has moved.
function cell(c){
  if(!c) return '<td class="na">&mdash;</td>';
  const cls = c.mob ? 'mobc' : (c.lean ? 'lnc' : '');
  return '<td' + (cls ? ' class="' + cls + '"' : '') + '>'
    + '<div class="ln">' + (c.line ? c.line + ' ' : '')
    + '<span class="od">' + c.odds + '</span></div>'
    + '<div class="sp">' + (c.b == null ? '' : c.b + '% / ' + c.m + '%')
    + (c.gap != null ? ' <span class="gap">&uarr;' + c.gap + '</span>' : '')
    + '</div>'
    + (c.open ? '<div class="op">opened ' + c.open + '</div>' : '')
    + '</td>';
}

                            + (g.vol ? ' &middot; ' + g.vol + 'x typical' : '') : ''));
    let foot = g.mobs.map(s =>
      '<div class="mobf"><span class="lbl">MOBMOM</span>'
      + '<span class="num">' + s.bet + '</span> '
      + '<span class="sub">(' + s.betType + ') &middot; ' + s.bets + '% of bets, '
      + s.money + '% of money &middot; this bet is </span>'
      + '<span class="num">' + s.record + ', ' + s.win + '%</span>'
      + '<span class="sub"> over ' + s.n + ' bets</span></div>').join('');
    // No MOBMOM in this game: name the biggest lean anyway and give it the record
    // that lean has ACTUALLY posted. It reads as a non-edge, which is the point --
    // the card says what the engine sees, including when what it sees is nothing.
    if(!foot && g.lean && DATA.lean.n){
      foot = '<div class="mobf lean"><span class="lbl">LEAN</span>'
        + '<span class="num">' + g.lean.bet + '</span> '
        + '<span class="sub">&middot; ' + g.lean.bets + '% of bets, '
        + g.lean.money + '% of money &middot; money under 50%, and leans like this go </span>'
        + '<span class="num">' + DATA.lean.rec + ', ' + DATA.lean.win + '%</span>'
        + '<span class="sub"> (n=' + DATA.lean.n + ') &mdash; not a bet</span></div>';
    }
    return '<div class="gm' + (g.done ? ' fin' : '') + '">'
      + '<div class="gmh"><span class="k">' + g.kick + '</span><span>' + hd + '</span></div>'
      + '<table class="gmt"><thead><tr><th></th>'
      + DATA.cardMarkets.map(m => '<th>' + m + '</th>').join('')
      + '</tr></thead><tbody>'
      + g.rows.map(r => '<tr><td class="tm">' + r.team + '</td>'
          + r.cells.map(cell).join('') + '</tr>').join('')
      + '</tbody></table>' + foot + '</div>';
  }).join('');
  return sec('Slate &mdash; Week ' + DATA.cardWeek,
    inner || '<div class="empty">No NFL games captured for this week.</div>');
}
function survivalSec(){
  return sec('Survival &mdash; best team to ride',
    (DATA.survivalPick?`<div class="note">Recommended ride: <span class="pill">${DATA.survivalPick}</span></div>`:'')
    + tbl(['Team','Opponent','Win %'], DATA.survival,
      r=>`<tr><td class="b">${r.team}</td><td>${r.opp}</td><td>${r.win}%</td></tr>`));
}
// NFL, one week, no sport switcher. The other three sports are still captured and
// still render in the private dashboard; they are just not published here.
document.getElementById('main').innerHTML = cardsSec() + survivalSec();
</script></body></html>
